name: Android release

# A signed APK on a GitHub release, which the app's update check and Obtainium follow:
# - a push to main that touches the app releases the next patch version (v0.8.0 -> v0.8.1) on its own;
# - tag v1.2.3 by hand for a bigger step;
# - a manual run (workflow_dispatch) only builds a test APK artifact.
# Needs repository secrets: SINK_KEYSTORE_BASE64, SINK_KEYSTORE_PASSWORD, SINK_KEY_ALIAS, SINK_KEY_PASSWORD.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# One release at a time, so two quick pushes don't both pick the same version.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The version: the tag's, the latest tag's next patch for a push to main, else a dev build.
      # (The tag a main release makes is pushed with GITHUB_TOKEN, which doesn't start another run.)
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
            IFS=. read -r major minor patch <<< "${last:-0.0.0}"
            v="$major.$minor.$((patch + 1))"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            v="0.0.0-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # The note editor page is bundled into the APK.
      - name: Build web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      # The runner image ships the Android SDK (ANDROID_HOME); Gradle fetches the platform version it needs.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SINK_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SINK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          SINK_KEYSTORE_PASSWORD: ${{ secrets.SINK_KEYSTORE_PASSWORD }}
          SINK_KEY_ALIAS: ${{ secrets.SINK_KEY_ALIAS }}
          SINK_KEY_PASSWORD: ${{ secrets.SINK_KEY_PASSWORD }}
          SINK_VERSION_CODE: ${{ github.run_number }}
          SINK_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          # Named by version: a branch name (claude/x) would put a slash in the file name.
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/sink-$SINK_VERSION_NAME.apk"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: steps.version.outputs.release == 'true'
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/sink-*.apk
          generate_release_notes: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.version.outputs.release != 'true'
        with:
          name: sink-apk
          path: ${{ runner.temp }}/sink-*.apk
