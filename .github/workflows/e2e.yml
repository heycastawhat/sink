name: Browser tests

# Playwright drives Chromium against a real Sink server with an empty scratch vault (e2e/harness.ts).
# This only tests: no tags, releases or pushes, read-only token. It's separate from android.yml (which releases on a
# push to main that touches android/** or web/**), and e2e/ is outside those paths, so changing the tests never
# starts a release.
on:
  push:
    branches: [main]
    paths: ["e2e/**", "web/**", "server/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["e2e/**", "web/**", "server/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # The server serves web/dist, and the harness imports the server's auth code.
      - name: Build the app
        run: |
          (cd server && bun install --frozen-lockfile)
          (cd web && bun install --frozen-lockfile && bun run build)
      - name: Install the browser
        working-directory: e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright-core install --with-deps chromium
      - name: Browser tests
        working-directory: e2e
        run: bun run test
      # Screenshots of the page when a test failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-failures
          path: e2e/test-results
          if-no-files-found: ignore
