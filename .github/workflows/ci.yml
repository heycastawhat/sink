name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Server tests
        working-directory: server
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun test
      - name: Web build
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
