<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sink</title>
    <meta name="theme-color" content="#4F378B" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <m3e-theme id="theme" color="#6750A4" variant="tonal-spot" motion="expressive" scheme="auto">
      <!-- Login -->
      <section id="login" class="login" hidden>
        <div class="login-card">
          <img src="/favicon.svg" alt="" class="login-logo" width="88" height="88" />
          <h1 class="wordmark">Sink</h1>
          <p class="muted">Everything but the kitchen sink. Well, including it.</p>
          <p id="login-error" class="error" hidden></p>
          <m3e-button id="login-submit" variant="filled" size="medium">
            <m3e-icon slot="icon" name="key"></m3e-icon><span id="login-label">Sign in</span>
          </m3e-button>
        </div>
      </section>

      <!-- App: sidebar | main. On phones the sidebar becomes the tab bar, and a note opens full screen. -->
      <div id="app" class="shell" hidden>
        <aside id="nav" class="nav" aria-label="Sections">
          <a class="brand" href="#/notes">
            <img id="logo" src="/favicon.svg" alt="" width="34" height="34" />
            <span class="wordmark">Sink</span>
          </a>
          <m3e-button id="add-btn" class="add-btn" variant="tonal" aria-haspopup="menu" aria-expanded="false">
            <m3e-icon slot="icon" name="add"></m3e-icon>New
          </m3e-button>
          <nav id="nav-views" class="nav-list"></nav>
          <div class="nav-heading">
            <span>Folders</span>
            <m3e-icon-button id="nav-folder-new" aria-label="New folder" title="New folder"><m3e-icon name="create_new_folder"></m3e-icon></m3e-icon-button>
          </div>
          <nav id="nav-folders" class="nav-list nav-tree" aria-label="Folders"></nav>
          <div class="nav-foot">
            <a class="nav-item" href="#/trash" data-route="trash"><m3e-icon name="delete"></m3e-icon><span>Trash</span></a>
            <a class="nav-item" href="#/settings" data-route="settings"><m3e-icon name="settings"></m3e-icon><span>Settings</span></a>
          </div>
        </aside>

        <main id="main" class="main">
          <header class="main-head">
            <!-- Inside a folder: its parents, above the title (which is the folder's name). -->
            <m3e-breadcrumb id="folder-crumbs" class="folder-crumbs" wrap aria-label="Folder" hidden></m3e-breadcrumb>
            <div class="title-row">
              <h1 id="view-title" class="view-title">Sink</h1>
              <span class="spacer"></span>
              <div id="folder-actions" class="folder-actions" hidden></div>
            </div>
            <div id="search-row" class="search-row">
              <m3e-search-bar class="search" clearable>
                <m3e-icon name="search" slot="leading"></m3e-icon>
                <input id="search" slot="input" placeholder="Search notes" aria-label="Search notes" />
              </m3e-search-bar>
            </div>
          </header>

          <!-- Notes: Keep-style grid; a card opens fullscreen. -->
          <section id="notes" class="notes" hidden>
            <div id="take-note" class="take-note">
              <input id="take-title" class="take-title" placeholder="Title" aria-label="Title" autocomplete="off" />
              <div class="take-row">
                <textarea id="take-body" class="take-body" rows="1" placeholder="Take a note…" aria-label="Take a note"></textarea>
                <span id="take-plugins" class="take-quick take-plugins"></span>
                <m3e-icon-button id="take-list" class="take-quick" aria-label="New list" title="New list"><m3e-icon name="check_box"></m3e-icon></m3e-icon-button>
                <m3e-icon-button id="take-board" class="take-quick" aria-label="New board" title="New board"><m3e-icon name="draw"></m3e-icon></m3e-icon-button>
              </div>
              <div class="take-actions">
                <m3e-icon-button id="take-open" aria-label="Open fullscreen" title="Open fullscreen"><m3e-icon name="open_in_full"></m3e-icon></m3e-icon-button>
                <span class="spacer"></span>
                <m3e-button id="take-close" variant="text" size="small">Close</m3e-button>
              </div>
            </div>
            <!-- Home only: what you opened or edited lately, like Drive's suggested files. -->
            <section id="notes-recent" class="recent-strip" hidden></section>
            <div id="folder-tiles" class="folder-tiles" aria-label="Folders"></div>
            <h2 id="notes-pinned-head" class="notes-head" hidden>Pinned</h2>
            <div id="notes-pinned" class="note-grid"></div>
            <h2 id="notes-others-head" class="notes-head" hidden>Others</h2>
            <div id="notes-grid" class="note-grid"></div>
            <div id="notes-empty" class="empty" hidden>
              <m3e-shape name="soft-burst" class="empty-shape"></m3e-shape>
              <h2 id="notes-empty-title" class="empty-title"></h2>
              <p id="notes-empty-body" class="muted"></p>
            </div>
          </section>


          <!-- Todos: every checkbox in every note. -->
          <section id="todos" class="todos" hidden>
            <form id="todo-form" class="todo-form">
              <m3e-icon name="add_task"></m3e-icon>
              <input id="todo-text" placeholder="Add a todo" aria-label="New todo" autocomplete="off" />
              <input id="todo-date" type="date" aria-label="Due date" />
              <input id="todo-time" type="time" aria-label="Remind at" />
              <m3e-button type="submit" variant="tonal" size="small" id="todo-add">Add</m3e-button>
            </form>
            <div id="todo-list"></div>
            <m3e-button id="todo-done-toggle" variant="text" size="small">Show done</m3e-button>
            <div id="todo-done" class="todo-done"></div>
          </section>

          <!-- Trash: notes deleted in Sink (and Obsidian), until they're emptied. -->
          <section id="trash" class="trash" hidden>
            <div class="trash-head">
              <p id="trash-info" class="muted small grow"></p>
              <m3e-button id="trash-empty" variant="text" size="small"><m3e-icon slot="icon" name="delete_forever"></m3e-icon>Empty trash</m3e-button>
            </div>
            <div id="trash-list" class="trash-list"></div>
            <div id="trash-none" class="empty" hidden>
              <m3e-shape name="soft-burst" class="empty-shape"></m3e-shape>
              <h2 class="empty-title">Trash is empty</h2>
              <p class="muted">Deleted notes wait here so you can put them back.</p>
            </div>
          </section>

          <section id="settings" class="settings" hidden></section>
        </main>

        <nav class="tabbar" aria-label="Sections">
          <a href="#/notes" data-tab="notes"><m3e-icon name="sticky_note_2"></m3e-icon><span>Notes</span></a>
          <a href="#/todos" data-tab="todos"><m3e-icon name="checklist"></m3e-icon><span>Todos</span></a>
          <a href="#/settings" data-tab="settings"><m3e-icon name="settings"></m3e-icon><span>Settings</span></a>
        </nav>

        <!-- New note / todo / folder / board: a FAB menu on phones (M3 Expressive style), a menu under "New" on desktop. -->
        <div id="fab-menu" class="fab-menu phone-only">
          <m3e-fab id="new-fab" variant="primary-container" aria-label="New">
            <m3e-fab-menu-trigger for="new-fab-menu"><m3e-icon name="add"></m3e-icon></m3e-fab-menu-trigger>
          </m3e-fab>
          <m3e-fab-menu id="new-fab-menu" variant="primary"></m3e-fab-menu>
        </div>
        <div id="new-menu" class="new-menu" role="menu" aria-label="New" hidden></div>

        <!-- One note, fullscreen. -->
        <section id="note-screen" class="note-screen" hidden aria-label="Note">
          <header class="note-bar">
            <m3e-icon-button id="note-back" aria-label="Back (Esc)" title="Back (Esc)"><m3e-icon name="arrow_back"></m3e-icon></m3e-icon-button>
            <span id="note-crumb" class="note-crumb"></span>
            <span class="spacer"></span>
            <span id="note-status" class="note-status" aria-live="polite"></span>
            <m3e-icon-button id="note-pin" aria-label="Pin" title="Pin"><m3e-icon name="push_pin"></m3e-icon></m3e-icon-button>
            <m3e-icon-button id="note-palette" aria-label="Colour" title="Colour"><m3e-icon name="palette"></m3e-icon></m3e-icon-button>
            <m3e-icon-button id="note-rename" aria-label="Rename" title="Rename"><m3e-icon name="drive_file_rename_outline"></m3e-icon></m3e-icon-button>
            <m3e-icon-button id="note-move" aria-label="Move to folder" title="Move to folder"><m3e-icon name="drive_file_move"></m3e-icon></m3e-icon-button>
            <m3e-icon-button id="note-history" aria-label="Version history" title="Version history"><m3e-icon name="history"></m3e-icon></m3e-icon-button>
            <m3e-icon-button id="note-download" aria-label="Download .md" title="Download .md"><m3e-icon name="download"></m3e-icon></m3e-icon-button>
            <m3e-icon-button id="note-delete" aria-label="Delete" title="Delete"><m3e-icon name="delete"></m3e-icon></m3e-icon-button>
          </header>
          <div id="note-colors" class="note-colors" hidden></div>
          <div class="note-scroll"><div id="note-editor" class="note-editor"></div><section id="note-links" class="note-links" hidden aria-label="Linked mentions"></section></div>
        </section>

      </div>

    </m3e-theme>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
