<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Shared note</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/embed.css" />
    <link rel="stylesheet" href="/src/share.css" />
  </head>
  <body>
    <main class="share">
      <div id="editor" class="note-editor"></div>
      <p id="share-missing" class="share-missing" hidden>This note isn't shared any more, or the link is wrong.</p>
    </main>
    <footer class="share-foot"><img src="/favicon.svg" alt="" width="18" height="18" /> Shared from <a href="https://github.com/heycastawhat/sink" rel="noopener">Sink</a></footer>
    <script type="module" src="/src/share.js"></script>
  </body>
</html>
